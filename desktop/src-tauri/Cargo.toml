[package]
name = "aitool-desktop"
version = "0.1.0"
description = "AiTool desktop shell — native window + tray around the local dashboard and proxy"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
